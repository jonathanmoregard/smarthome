name: CI

# Feature branches are covered by their pull_request run; push is only for
# main, so a PR commit is not tested twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      system: ${{ steps.changes.outputs.system }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changes
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE_SHA"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}"; then
            git diff --name-only -z "$base" "$GITHUB_SHA" \
              | bash nix/ci/classify-paths.sh >> "$GITHUB_OUTPUT"
          else
            git ls-tree -r --name-only -z "$GITHUB_SHA" \
              | bash nix/ci/classify-paths.sh >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    name: evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Evaluate all outputs
        run: nix flake check --no-build -L

  system:
    name: home-server checks
    needs: classify
    if: needs.classify.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      # `nix flake check` enumerates `checks` from the flake itself, so a check
      # cannot be declared and never built. The list this replaced was
      # hand-maintained and had silently drifted: `pair-zigbee` was declared in
      # flake.nix and absent here, so as far as CI was concerned it had never
      # run. The same list also had to be edited by hand to add
      # `zigbee2mqtt-watchdog` next to the check itself -- that is the drift
      # mechanism rather than a second omission, and it is what this removes.
      # `classify-paths.sh` routes every non-docs path into this one lane, so
      # building the whole `checks` set is what this lane already meant to do.
      #
      # The toplevel build stays explicit: `nix flake check` only evaluates
      # `nixosConfigurations`, it does not realise the system closure.
      - name: Build all flake checks and the home-server closure
        run: |
          nix flake check -L
          nix build --no-link -L \
            .#nixosConfigurations.home-server.config.system.build.toplevel

  ci:
    name: CI
    if: always()
    needs:
      - classify
      - evaluate
      - system
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          SYSTEM_SELECTED: ${{ needs.classify.outputs.system }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success || "$EVALUATE_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$SYSTEM_SELECTED" == true && "$SYSTEM_RESULT" != success ]]; then
            exit 1
          fi
          for result in "$CLASSIFY_RESULT" "$EVALUATE_RESULT" "$SYSTEM_RESULT"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done
