name: CI

# Feature branches are covered by their pull_request run; push is only for
# main, so a PR commit is not tested twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scripts: ${{ steps.changes.outputs.scripts }}
      system: ${{ steps.changes.outputs.system }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: changes
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE_SHA"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}"; then
            git diff --name-only -z "$base" "$GITHUB_SHA" \
              | bash nix/ci/classify-paths.sh >> "$GITHUB_OUTPUT"
          else
            git ls-tree -r --name-only -z "$GITHUB_SHA" \
              | bash nix/ci/classify-paths.sh >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    name: evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Evaluate all outputs
        run: nix flake check --no-build -L

  system:
    name: home-server checks
    needs: classify
    if: needs.classify.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Build home-server checks
        run: |
          nix build --no-link -L \
            .#checks.x86_64-linux.standalone-host \
            .#checks.x86_64-linux.home-server-ssh \
            .#checks.x86_64-linux.home-server-services \
            .#checks.x86_64-linux.system-deploy \
            .#checks.x86_64-linux.system-activator \
            .#checks.x86_64-linux.hydrator \
            .#checks.x86_64-linux.vm-home-server \
            .#checks.x86_64-linux.vm-home-server-cd \
            .#nixosConfigurations.home-server.config.system.build.toplevel

  scripts:
    name: lighting scripts checks
    needs: classify
    if: needs.classify.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lighting-scripts
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
      # The audit tooling tests build their own fixtures, so they run anywhere.
      # `npm run audit:responses` itself is capture-only and deliberately absent,
      # as is `npm run parity`: both need private, gitignored household captures
      # that never leave the capture host, so neither can run on a GitHub runner.
      - name: Audit tooling tests
        run: python3 -m unittest discover -s tests/tools -p 'test_*.py'

  ci:
    name: CI
    if: always()
    needs:
      - classify
      - evaluate
      - scripts
      - system
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          SCRIPTS_SELECTED: ${{ needs.classify.outputs.scripts }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          SYSTEM_SELECTED: ${{ needs.classify.outputs.system }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success || "$EVALUATE_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$SCRIPTS_SELECTED" == true && "$SCRIPTS_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$SYSTEM_SELECTED" == true && "$SYSTEM_RESULT" != success ]]; then
            exit 1
          fi
          for result in \
            "$CLASSIFY_RESULT" \
            "$EVALUATE_RESULT" \
            "$SCRIPTS_RESULT" \
            "$SYSTEM_RESULT"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              exit 1
            fi
          done
