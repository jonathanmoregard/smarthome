schema_version = 1

[mqtt]
host = "127.0.0.1"
port = 1883
client_id = "house-automation-example"
application_namespace = "house/v1"
zigbee2mqtt_base_topic = "zigbee2mqtt"

[mqtt.credentials]
environment_file = "/run/credentials/house-automationd.service/mqtt.env"
username_variable = "MQTT_USERNAME"
password_variable = "MQTT_PASSWORD"

[input]
double_click_window_ms = 350
ambiguous_center_hold_window_ms = 1200

[circadian]
daily_reset_time = "04:00"
unfreeze_convergence_seconds = 30
tick_seconds = 30
brightness_change_threshold = 0.01
color_temperature_change_threshold_kelvin = 25
maximum_refresh_seconds = 300

[acknowledgement]
overlay_id = "circadian-ack"
amplitude = 0.10
duration_ms = 180
priority = 100

[whole_hour]
brightness_delta = 0.08
duration_ms = 500
priority = 10

[reconciliation]
retry_interval_seconds = 5
maximum_attempts = 3
dispatch_acceptance_margin_seconds = 5
dispatch_failure_backoff_seconds = 0.5

[health]
bind = "127.0.0.1:9876"
allow_non_loopback = false

[[floors]]
id = "ground-floor"

[[rooms]]
id = "living-room"
floor = "ground-floor"

[[curves]]
id = "default-day"
anchors = [
  { time = "04:00", brightness = 0.10, color_temperature_kelvin = 2200 },
  { time = "08:00", brightness = 0.75, color_temperature_kelvin = 4000 },
  { time = "13:00", brightness = 1.00, color_temperature_kelvin = 5000 },
  { time = "19:00", brightness = 0.55, color_temperature_kelvin = 3000 },
  { time = "23:00", brightness = 0.20, color_temperature_kelvin = 2400 },
]

[[scopes]]
id = "living-room-lights"
kind = "room"
room = "living-room"
curve = "default-day"

[[scopes]]
id = "ground-floor-lights"
kind = "floor"
floor = "ground-floor"
curve = "default-day"

[[scopes]]
id = "whole-house"
kind = "house"
curve = "default-day"

[[devices]]
id = "reading-light"
aliases = ["ikea-led2111g6-example"]
friendly_name = "demo/living-room/reading-light"
room = "living-room"
single_transition_attribute = true
capabilities = { on_off = true, dimming = true, color_temperature = { minimum_kelvin = 2200, maximum_kelvin = 4000, minimum_mired = 250, maximum_mired = 454 } }

[[devices]]
id = "color-light"
aliases = ["hue-color-example"]
friendly_name = "demo/living-room/color-light"
room = "living-room"
capabilities = { on_off = true, dimming = true, color_temperature = { minimum_kelvin = 2200, maximum_kelvin = 6500, minimum_mired = 153, maximum_mired = 454 }, color_xy = true, color_hs = true }
color_comparison = { xy_tolerance = 0.03, achromatic_saturation_threshold = 0.02, gamut = { red = [0.6915, 0.3083], green = [0.1700, 0.7000], blue = [0.1532, 0.0475] } }

[[groups]]
id = "living-room-zigbee"
friendly_name = "demo/living-room/lights"
members = ["reading-light", "color-light"]
single_transition_attribute = true
# CCT remains declared/validated, but omitted mired bounds send it per device;
# the synchronized group command carries only power and brightness.
capabilities = { on_off = true, dimming = true, color_temperature = { minimum_kelvin = 2200, maximum_kelvin = 4000 } }

[[controls]]
id = "living-room-remote"
aliases = ["ikea-e1810-example"]
friendly_name = "demo/living-room/remote"
selected_scope = "living-room-lights"
mappings = [
  { gesture = "up", target = "selected", action = { kind = "adjust_brightness_offset", delta = 0.05 } },
  { gesture = "down", target = "selected", action = { kind = "adjust_brightness_offset", delta = -0.05 } },
  { gesture = "left", target = "selected", action = { kind = "adjust_color_temperature_offset", delta_kelvin = -150 } },
  { gesture = "right", target = "selected", action = { kind = "adjust_color_temperature_offset", delta_kelvin = 150 } },
  { gesture = "center_single", target = "selected", action = { kind = "toggle_power" } },
  { gesture = "center_double", target = "selected", action = { kind = "toggle_circadian_with_acknowledgement" } },
]
